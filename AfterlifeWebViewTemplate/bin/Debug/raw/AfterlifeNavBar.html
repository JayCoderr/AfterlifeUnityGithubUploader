<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Navbar</title>

    <style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: rgba(0, 0, 0, 0);
    font-family: "Segoe UI", sans-serif;
}

/* =========================
   NAVBAR CONTAINER
========================= */
#navbar {
    width: 100%;
    height: 40px;

    display: flex;
    align-items: center;

    padding: 0 8px;
    box-sizing: border-box;

    background: rgba(0, 100, 162, 1);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border-bottom: 1px solid rgba(255, 255, 255, 0.05);

    /* KEY FIX: pushes left + right sections apart */
    justify-content: space-between;
}

/* =========================
   LOGO AREA
========================= */
#logo {
    display: flex;
    align-items: center;
    justify-content: flex-start;

    height: 100%;
}

#logo img {
    height: 145px;
    width: auto;

    object-fit: contain;

    user-select: none;
    -webkit-user-drag: none;

    background: transparent;
}

/* =========================
   WINDOW BUTTONS
========================= */
#window-controls {
    display: flex;
    gap: 6px;

    /* ensures it stays fully right */
    margin-left: auto;
}

.btn {
    width: 23px;
    height: 23px;

    border: none;
    border-radius: 50%;

    background: rgba(40, 40, 40, 0.9);
    color: white;

    cursor: pointer;
    font-size: 10px;

    display: flex;
    align-items: center;
    justify-content: center;

    transition: 0.15s ease;
}

.btn:hover {
    background: rgba(70, 70, 70, 0.95);
}

.btn:active {
    transform: scale(0.95);
}

.close {
    background: rgba(180, 50, 50, 0.9);
}

.close:hover {
    background: rgba(220, 60, 60, 1);
}
    </style>
</head>

<body>

    <div id="navbar">

        <!-- LOGO -->
        <div id="logo">
            <img src="titlelogo.png" alt="logo">
        </div>

        <!-- WINDOW CONTROLS -->
        <div id="window-controls">
            <button class="btn" onclick="minimize()">─</button>
            <button class="btn" onclick="maximize()">⬜</button>
            <button class="btn close" onclick="closeApp()">✕</button>
        </div>

    </div>

    <script>
        function minimize() {
            window.chrome.webview.postMessage("minimize");
        }

        function maximize() {
            window.chrome.webview.postMessage("maximize");
        }

        function closeApp() {
            window.chrome.webview.postMessage("close");
        }
    </script>

</body>
</html>
